services:
  backend:
    image: ghcr.io/fishcat233/kx-exam-system-backend:latest
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://exam:exam123@db:5432/exam_system
      SECRET_KEY: "${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}"
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:-admin}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?请在 .env 中设置 SUPER_ADMIN_PASSWORD}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-超级管理员}"
      CORS_ORIGINS: '["*"]'
      WS_HOST: "${WS_HOST:?请在 .env 中设置 WS_HOST 为部署机域名或 IP}"
      WS_PORT: "80"
      WS_SCHEME: "ws"
    restart: unless-stopped

  frontend:
    image: ghcr.io/fishcat233/kx-exam-system-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: exam_system
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
